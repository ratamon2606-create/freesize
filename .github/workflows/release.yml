name: Publish and deploy verified release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: wardrobeshare-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable GHCR images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      web_image: ${{ steps.images.outputs.web_image }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true
      - name: Skip superseded runs
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHA='${{ github.event.workflow_run.head_sha }}'
          CURRENT=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$SHA" != "$CURRENT" ]]; then
            echo 'This CI run is not the current main. Refusing to publish/deploy stale commit.'
            exit 1
          fi
          BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "commit=$SHA" >> "$GITHUB_OUTPUT"
          echo "web_repo=${BASE}-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish web image
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.web_repo }}:sha-${{ steps.meta.outputs.commit }}
      - name: Capture immutable digests
        id: images
        run: |
          echo "web_image=${{ steps.meta.outputs.web_repo }}@${{ steps.web.outputs.digest }}" >> "$GITHUB_OUTPUT"

  notify_local:
    name: Trigger private laptop deploy after GHCR publish
    needs: publish
    if: ${{ needs.publish.result == 'success' && vars.FREESIZE_PUSH_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Notification failures must not invalidate a published GHCR release; the 30-minute timer is fallback.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Connect to Freesize tailnet (ephemeral runner)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:freesize-ci
          ping: ${{ vars.FREESIZE_TAILSCALE_IP }}
      - name: Request restricted laptop deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.FREESIZE_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FREESIZE_SSH_KNOWN_HOSTS }}
          TAILSCALE_IP: ${{ vars.FREESIZE_TAILSCALE_IP }}
          EXPECTED_SHA: ${{ needs.publish.outputs.commit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TAILSCALE_IP" =~ ^100\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Configure FREESIZE_TAILSCALE_IP as the Ubuntu tailnet IPv4 address'; exit 2; }
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid published commit SHA'; exit 2; }
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]] || { echo 'Configure restricted SSH secrets'; exit 2; }
          install -d -m 0700 "$RUNNER_TEMP/freesize-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/freesize-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/freesize-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/freesize-ssh/id_ed25519" "$RUNNER_TEMP/freesize-ssh/known_hosts"
          # Fail closed if the server's pinned SSH host key differs.
          timeout 570 ssh -4 -F /dev/null -T \
            -i "$RUNNER_TEMP/freesize-ssh/id_ed25519" -p 2222 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/freesize-ssh/known_hosts" \
            -o ConnectTimeout=20 \
            "freesize-trigger@$TAILSCALE_IP" "deploy $EXPECTED_SHA"
          echo "Laptop deploy trigger completed for ${EXPECTED_SHA:0:12}"

  production:
    name: Production approval and deployment
    needs: publish
    # OFF by default. Explicitly set Repository Variable DEPLOY_ENABLED=true
    # after resolving production security/requirements blockers.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - name: Deploy over SSH with health-check and automatic image rollback
        env:
          PROD_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_HOST_KEYS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          WEB_IMAGE: ${{ needs.publish.outputs.web_image }}
          SOURCE_SHA: ${{ needs.publish.outputs.commit }}
          PUBLIC_URL: ${{ vars.PROD_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -n "$PROD_HOST" && test -n "$PROD_USER"
          # The server configuration must have been bootstrapped once.
          test -n "$PUBLIC_URL" && [[ "$PUBLIC_URL" == https://* ]] || { echo 'Set PROD_PUBLIC_ORIGIN to your https:// domain'; exit 2; }
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$PROD_USER@$PROD_HOST" \
            "bash -s -- '$WEB_IMAGE' '$SOURCE_SHA'" < deploy/deploy-release.sh
          # Test real public reachability from the GitHub runner. If it fails,
          # immediately run the manual rollback script against the previous image.
          if ! curl --fail --silent --show-error --location --retry 4 \
              --retry-all-errors --retry-delay 3 --max-time 12 \
              "$PUBLIC_URL/api/ready" | python3 -c \
                'import json,sys; d=json.load(sys.stdin); assert d["ready"] and d["sql"]=="PostgreSQL" and d["nosql"]=="MongoDB"'; then
            echo 'Public smoke failed; attempting remote rollback' >&2
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$PROD_USER@$PROD_HOST" \
              'bash /opt/wardrobeshare/rollback-release.sh' || true
            exit 1
          fi
          echo "Public release verified: $PUBLIC_URL"
