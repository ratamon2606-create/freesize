name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and API (preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Python syntax and JavaScript syntax
        run: |
          python -m compileall -q app.py tests
          node --check static/js/app.js
          for f in scripts/*.sh deploy/*.sh; do bash -n "$f"; done
          python scripts/requirements_static_audit.py
      - name: Preview integration tests
        env:
          SEED_DEMO: '1'
        run: python -m pytest tests/test_integration.py tests/test_production_safety.py tests/test_ootd_preview_layout.py -q


  browser:
    name: Browser UI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install server and browser test tools
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Start isolated preview server and run browser smoke
        env:
          SEED_DEMO: '1'
          DATA_DIR: ${{ runner.temp }}/wardrobe-browser-test
        run: |
          set -euo pipefail
          python -m uvicorn app:app --host 127.0.0.1 --port 3000 > /tmp/wardrobe-server.log 2>&1 &
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/ready
          python tests/ui_smoke.py

  hybrid:
    name: Hybrid DB (PostgreSQL + MongoDB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wardrobeshare_test
          POSTGRES_USER: wardrobe
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wardrobe -d wardrobeshare_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 10s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: True hybrid integration and SQL rollback test
        env:
          DATABASE_URL: postgresql://wardrobe:ci_only_password@localhost:5432/wardrobeshare_test
          MONGO_URL: mongodb://localhost:27017/
          SEED_DEMO: '0'
          DATA_DIR: ${{ runner.temp }}/wardrobe-hybrid-test
          WARDROBE_TEST_HYBRID: '1'
          EVIDENCE_OUTPUT_DIR: docs/screenshots/evidence
        run: python -m pytest tests/test_hybrid_integration.py -q
      - name: Preserve real database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-database-rollback-proof
          path: docs/screenshots/evidence/*.json
          if-no-files-found: warn

  image:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci_example_password
          MONGO_ROOT_USERNAME: ci_example_user
          MONGO_ROOT_PASSWORD: ci_example_password
          PUBLIC_ORIGIN: https://closet.example.org
          SITE_DOMAIN: closet.example.org
          WEB_IMAGE: ghcr.io/example/wardrobe-web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: docker compose -f deploy/compose.production.yml config --quiet
      - name: Validate Caddy HTTPS reverse-proxy configuration
        run: docker run --rm -e SITE_DOMAIN=closet.example.org -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build web image
        run: docker build -t wardrobeshare-web:ci .

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Dependency vulnerability scan (fails if vulnerable)
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-inference.txt
