# Closed-beta production: Caddy HTTPS + monolithic web/AI + two private DBs.
# On a dedicated Ubuntu VPS: docker compose --env-file .env -f compose.production.yml up -d
name: wardrobeshare-prod
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wardrobeshare
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardrobe -d wardrobeshare"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]
    logging: {options: {max-size: '10m', max-file: '3'}}

  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 10s
      timeout: 8s
      retries: 20
    networks: [private]
    logging: {options: {max-size: '10m', max-file: '3'}}

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE}
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://wardrobe:${POSTGRES_PASSWORD}@postgres:5432/wardrobeshare
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      U2NET_HOME: /app/models
      REQUIRE_BACKGROUND_AI: '1'
      DATA_DIR: /app/data
      SEED_DEMO: '0'
      COOKIE_SECURE: '1'
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      MAX_BETA_USERS: '25'
    depends_on:
      postgres: {condition: service_healthy}
      mongodb: {condition: service_healthy}
    volumes:
      - uploaded_media:/app/data
      - ./models:/app/models:ro
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request;urllib.request.urlopen("http://127.0.0.1:3000/api/ready",timeout=5).read()']
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 50s
    networks: [private, edge]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: {options: {max-size: '10m', max-file: '3'}}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    depends_on:
      web: {condition: service_healthy}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    security_opt: ['no-new-privileges:true']
    logging: {options: {max-size: '10m', max-file: '3'}}

networks:
  private:
    internal: true
  edge: {}
volumes:
  pg_data: {}
  mongo_data: {}
  uploaded_media: {}
  caddy_data: {}
  caddy_config: {}
