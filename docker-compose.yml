name: wardrobeshare
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wardrobeshare
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_wardrobe_only}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardrobe -d wardrobeshare"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 8s
      retries: 20
    networks: [internal]

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wardrobe:${POSTGRES_PASSWORD:-local_dev_wardrobe_only}@postgres:5432/wardrobeshare
      MONGO_URL: mongodb://mongodb:27017/
      U2NET_HOME: /app/models
      REQUIRE_BACKGROUND_AI: ${REQUIRE_BACKGROUND_AI:-0}
      DATA_DIR: /app/data
      SEED_DEMO: ${SEED_DEMO:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - uploaded_media:/app/data
      - ${LOCAL_AI_MODELS_DIR:-./models}:/app/models:ro
    networks: [internal]

networks:
  internal:
volumes:
  pg_data:
  mongo_data:
  uploaded_media:
