<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" fill="none">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#c9c6c3"/>
      <stop offset=".42" stop-color="#6f6a66"/>
      <stop offset=".55" stop-color="#f4f1ee"/>
      <stop offset=".75" stop-color="#8d8782"/>
      <stop offset="1" stop-color="#e9e5e1"/>
    </linearGradient>
    <linearGradient id="chromeText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#cfcac6"/>
      <stop offset=".5" stop-color="#5d5753"/>
      <stop offset=".72" stop-color="#e8e3df"/>
      <stop offset="1" stop-color="#9b948f"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c98a6c" stop-opacity="0"/>
      <stop offset=".35" stop-color="#c98a6c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e3b195" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b1716"/>
      <stop offset=".5" stop-color="#8e2a24"/>
      <stop offset="1" stop-color="#3e0f0e"/>
    </linearGradient>
    <radialGradient id="mouth" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#1a0605"/>
      <stop offset="1" stop-color="#3a0f0c"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#120806" flood-opacity=".55"/>
    </filter>
    <filter id="glow"><feGaussianBlur stdDeviation="1.4"/></filter>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0-10C1 -3 3-1 10 0C3 1 1 3 0 10C-1 3-3 1-10 0C-3-1-1-3 0-10Z" fill="#fff"/>
    </symbol>
    <symbol id="ostar" viewBox="-50 -50 100 100">
      <path d="M0-46L12-14L46-12L19 8L28 42L0 23L-28 42L-19 8L-46-12L-12-14Z" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M0-34L8-10L33-9L13 6L20 30L0 16L-20 30L-13 6L-33-9L-8-10Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" opacity=".75"/>
    </symbol>
  </defs>

  <!-- tribal flames -->
  <g fill="url(#flame)" opacity=".9">
    <path d="M120 250C190 214 250 210 300 230C262 206 230 184 236 150C252 186 300 200 350 206C318 186 300 160 312 128C326 166 368 184 420 188C380 214 300 252 120 250Z"/>
    <path d="M150 116C212 120 258 104 286 70C282 104 300 120 336 126C306 132 290 148 296 176C270 148 228 132 150 116Z"/>
    <path d="M700 60C650 74 618 100 606 138C626 116 652 110 690 116C660 128 640 150 640 182C656 160 682 152 712 156C690 140 690 98 700 60Z"/>
    <path d="M640 300C600 280 560 282 520 302C548 276 552 250 540 222C566 246 600 252 640 244C616 262 616 282 640 300Z"/>
  </g>

  <!-- orbit + chrome star -->
  <g filter="url(#drop)" transform="translate(255 168) rotate(-8)">
    <ellipse rx="140" ry="40" stroke="#f3eee9" stroke-width="2.4" transform="rotate(-18)" opacity=".85"/>
    <path d="M0-112L28-36L108-34L44 14L66 92L0 46L-66 92L-44 14L-108-34L-28-36Z" fill="url(#chrome)" stroke="#2a1610" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0-82L19-26L78-25L32 10L48 66L0 34L-48 66L-32 10L-78-25L-19-26Z" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" opacity=".7"/>
    <path d="M-140 0A140 40 0 0 0 132 14" stroke="#f3eee9" stroke-width="2.4" transform="rotate(-18)" opacity=".9"/>
    <g fill="#fff" opacity=".85">
      <circle cx="-6" cy="-60" r="3"/><circle cx="10" cy="-30" r="2.4"/><circle cx="-30" cy="-12" r="2.6"/>
      <circle cx="40" cy="-4" r="2.4"/><circle cx="-14" cy="22" r="3"/><circle cx="24" cy="40" r="2.2"/>
    </g>
  </g>

  <!-- glossy lips -->
  <g filter="url(#drop)" transform="translate(520 120) rotate(-12)">
    <path d="M-120 0C-90-52-48-70-14-52C-4-58 6-58 16-52C50-70 92-52 122 0C92 64 44 86 0 86C-44 86-92 64-120 0Z" fill="url(#lip)" stroke="#250908" stroke-width="2.5"/>
    <path d="M-92 6C-60-18-30-22 0-16C30-22 60-18 94 6C64 44 34 54 0 54C-34 54-64 44-92 6Z" fill="url(#mouth)"/>
    <path d="M-80 4C-52-10-26-12 0-8C26-12 52-10 82 4L76 18C50 10 26 9 0 11C-26 9-50 10-74 18Z" fill="#f4ede6" stroke="#bfb3a8" stroke-width="1"/>
    <g stroke="#bfb3a8" stroke-width="1"><path d="M-54 0v13M-28-6v15M0-8v19M28-6v15M54 0v13"/></g>
    <path d="M-30 38C-12 30 12 30 30 38C14 48-14 48-30 38Z" fill="#a8423b" opacity=".8"/>
    <path d="M-86-14C-64-40-40-48-20-40" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55" filter="url(#glow)"/>
    <path d="M34-42C56-48 78-38 96-16" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".45" filter="url(#glow)"/>
    <path d="M-50 70C-20 80 20 80 52 70" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".4" filter="url(#glow)"/>
  </g>

  <!-- #SWAG chrome lettering -->
  <g transform="translate(420 262) rotate(-14)" filter="url(#drop)">
    <text x="0" y="0" font-family="Impact, 'Arial Black', sans-serif" font-size="68" font-style="italic" letter-spacing="2" fill="url(#chromeText)" stroke="#1b0d09" stroke-width="3" paint-order="stroke">#SWAG</text>
  </g>

  <!-- outline stars + sparkles -->
  <use href="#ostar" x="618" y="10" width="72" height="72" transform="rotate(10 654 46)"/>
  <use href="#ostar" x="560" y="268" width="50" height="50" opacity=".8"/>
  <use href="#ostar" x="112" y="34" width="44" height="44" opacity=".7"/>
  <use href="#spark" x="400" y="40" width="22" height="22"/>
  <use href="#spark" x="682" y="210" width="16" height="16"/>
  <use href="#spark" x="180" y="270" width="18" height="18" opacity=".8"/>
  <use href="#spark" x="430" y="300" width="14" height="14" opacity=".7"/>
</svg>
