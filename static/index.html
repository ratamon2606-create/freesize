<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >
  <meta name="theme-color" content="#1f1814">

  <script>
    if (['/', '/home', '/home/'].includes(location.pathname)) {
      document.documentElement.classList.add('fs-intro-active');
    }
  </script>

  <link
    rel="preload"
    href="/assets/wardrobe-doors-solid-walnut.jpg"
    as="image"
  >

  <title>freesize — เพราะผมใส่ได้ทุกตัว</title>

  <link rel="stylesheet" href="/css/app.css?v=48">
  <link rel="stylesheet" href="/css/entrance.css?v=6">
</head>

<body>
  <div id="app">
    <div class="boot">
      <span class="brand-script">freesize</span>
      <p>Opening your little closet…</p>
    </div>
  </div>

  <div
    id="fs-entrance"
    class="fs-entrance"
    aria-label="Freesize wardrobe opening animation"
    aria-hidden="true"
  >
    <div class="fs-entrance__depth"></div>

    <div class="fs-entrance__portal">
      <div class="fs-entrance__doors">
        <div class="fs-entrance__door fs-entrance__door--left"></div>
        <div class="fs-entrance__door fs-entrance__door--right"></div>
      </div>
    </div>

    <div class="fs-entrance__words">
      <div class="fs-entrance__brand brand-script">freesize</div>
      <div class="fs-entrance__tagline">เพราะผมใส่ได้ทุกตัว</div>
    </div>
  </div>

  <script type="module" src="/js/entrance.js?v=4"></script>
  <script type="module" src="/js/app.js?v=25"></script>
</body>
</html>
